name: CI
on: [push, pull_request]

jobs:
  test-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test (software backend)
        run: |
          for t in test_arena test_math test_layout test_gfx test_runtime test_font test_input test_image bench_gfx fuzz_gfx; do
            clang -I include -I tools -Wall -Wextra -Wpedantic -Wshadow \
              tests/${t}.c -lm -o /tmp/$t && /tmp/$t
          done
      - name: Build stock_dashboard + PPM output
        run: |
          clang -O3 -DSC_GFX_IMPLEMENTATION -DSC_LAYOUT_IMPLEMENTATION \
            -DSC_WIDGET_IMPLEMENTATION -DSC_RUNTIME_IMPLEMENTATION \
            -DSC_FONT_IMPLEMENTATION -DSC_GFX_BACKEND_SOFTWARE \
            -I include -I tools apps/stock_dashboard/stock_dashboard.c \
            -lm -o /tmp/stock_dashboard
          /tmp/stock_dashboard
          file silvercore.ppm

  test-vulkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev mesa-vulkan-drivers
      - name: Compile Vulkan backend
        run: |
          clang -I include -I tools -DSC_GFX_IMPLEMENTATION \
            -DSC_GFX_BACKEND_VULKAN -DSC_BACKEND_VULKAN_IMPLEMENTATION \
            -DSC_LAYOUT_IMPLEMENTATION -DSC_WIDGET_IMPLEMENTATION \
            -DSC_RUNTIME_IMPLEMENTATION -DSC_FONT_IMPLEMENTATION \
            -x c -c backends/sc_backend_vulkan.h -o /dev/null \
            -Wall -Wextra -Wpedantic -Wshadow
      - name: Build and run Vulkan headless test
        run: |
          clang -I include -I tools -I backends \
            -DSC_GFX_IMPLEMENTATION \
            -DSC_GFX_BACKEND_VULKAN -DSC_BACKEND_VULKAN_IMPLEMENTATION \
            -DSC_LAYOUT_IMPLEMENTATION -DSC_WIDGET_IMPLEMENTATION \
            -DSC_RUNTIME_IMPLEMENTATION -DSC_FONT_IMPLEMENTATION \
            -DSC_TEST_BACKEND=SC_BACKEND_VULKAN \
            -Wall -Wextra -Wpedantic -Wshadow \
            -x c backends/sc_backend_vulkan.h -c -o /tmp/vk.o
          clang -I include -I tools -I backends \
            -DSC_GFX_BACKEND_VULKAN \
            -DSC_TEST_BACKEND=SC_BACKEND_VULKAN \
            -DSC_TEST_NO_IMPL \
            -Wall -Wextra -Wpedantic -Wshadow \
            -x c tests/test_gfx.c -c -o /tmp/test_gfx.o
          clang /tmp/vk.o /tmp/test_gfx.o -lm -lvulkan -o /tmp/test_vk
          /tmp/test_vk

  test-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test with AddressSanitizer
        run: |
          for t in test_arena test_math test_layout test_gfx test_runtime test_font test_input test_image fuzz_gfx; do
            clang -I include -I tools -Wall -Wextra -Wpedantic -Wshadow \
              -fsanitize=address -fno-omit-frame-pointer \
              tests/${t}.c -lm -o /tmp/$t && /tmp/$t
          done

  test-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & test with UndefinedBehaviorSanitizer
        run: |
          for t in test_arena test_math test_layout test_gfx test_runtime test_font test_input test_image fuzz_gfx; do
            clang -I include -I tools -Wall -Wextra -Wpedantic -Wshadow \
              -fsanitize=undefined -fno-sanitize-recover=undefined \
              tests/${t}.c -lm -o /tmp/$t && /tmp/$t
          done

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Metal backend (Obj-C)
        run: |
          clang -I include -I tools -DSC_GFX_IMPLEMENTATION \
            -DSC_GFX_BACKEND_METAL -DSC_BACKEND_METAL_IMPLEMENTATION \
            -DSC_LAYOUT_IMPLEMENTATION -DSC_WIDGET_IMPLEMENTATION \
            -DSC_RUNTIME_IMPLEMENTATION -DSC_FONT_IMPLEMENTATION \
            -x objective-c -c backends/sc_backend_metal.h -o /dev/null \
            -fobjc-arc -Wall -Wextra -Wpedantic -Wshadow
      - name: Build and run Metal test
        run: |
          clang -I include -I tools -I backends \
            -DSC_GFX_IMPLEMENTATION \
            -DSC_GFX_BACKEND_METAL -DSC_BACKEND_METAL_IMPLEMENTATION \
            -DSC_LAYOUT_IMPLEMENTATION -DSC_WIDGET_IMPLEMENTATION \
            -DSC_RUNTIME_IMPLEMENTATION -DSC_FONT_IMPLEMENTATION \
            -Wall -Wextra -Wpedantic -Wshadow \
            -x objective-c backends/sc_backend_metal.h -c -o /tmp/metal.o \
            -fobjc-arc
          clang -I include -I tools -I backends \
            -DSC_GFX_BACKEND_METAL \
            -DSC_TEST_BACKEND=SC_BACKEND_METAL \
            -DSC_TEST_NO_IMPL \
            -Wall -Wextra -Wpedantic -Wshadow \
            -x c tests/test_gfx.c -c -o /tmp/test_gfx_metal.o
          clang /tmp/metal.o /tmp/test_gfx_metal.o \
            -fobjc-arc -lm -framework Metal -framework MetalKit \
            -framework Cocoa -o /tmp/test_metal
          /tmp/test_metal > /tmp/mtl_out.txt 2>&1 || { ec=$?; echo "exit=$ec" >> /tmp/mtl_out.txt; exit $ec; }
      - name: Upload Metal debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metal-debug
          path: |
            /tmp/mtl_out.txt
            ${{ runner.os == 'macOS' && '~/Library/Logs/DiagnosticReports' || '' }}
        if-no-files-found: ignore

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.7
      - name: Build WASM target
        run: |
          emcmake cmake -S . -B build-wasm -DWASM=ON -DSC_TESTS=OFF -DSC_SHARED=OFF
          cmake --build build-wasm -j$(nproc)
      - name: Verify WASM output
        run: |
          ls -lh build-wasm/*.wasm build-wasm/*.js
